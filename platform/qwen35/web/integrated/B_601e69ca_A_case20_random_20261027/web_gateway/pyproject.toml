[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-web-gateway"
version = "0.1.0"
description = "Local text consultation API and SSE bridge for the KV260 project"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
patient-web = "patient_web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patient_web = ["cases/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

